<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Walid Adra — Full-Stack &amp; Platform Engineer, founder of WebRift">
<title>Walid Adra — Full-Stack &amp; Platform Engineer</title>
<defs>
<linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#0055FF"/><stop offset="1" stop-color="#059669"/></linearGradient>
<radialGradient id="ga" cx="0.15" cy="0.1" r="0.7"><stop offset="0" stop-color="#0055FF" stop-opacity="0.16"/><stop offset="1" stop-color="#0055FF" stop-opacity="0"/></radialGradient>
<radialGradient id="gb" cx="0.92" cy="0.9" r="0.6"><stop offset="0" stop-color="#059669" stop-opacity="0.12"/><stop offset="1" stop-color="#059669" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DCE5F2" stroke-width="1"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="gm"><rect width="1000" height="360" fill="url(#fade)"/></mask>
<clipPath id="card"><rect width="1000" height="360" rx="18"/></clipPath>
<style>
.w1{animation:drift 14s linear infinite}.w2{animation:drift 22s linear infinite reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-500px)}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.w1,.w2,.pulse{animation:none}}
</style>
</defs>
<g clip-path="url(#card)">
<rect width="1000" height="360" fill="#F5F8FC"/>
<rect width="1000" height="360" fill="url(#grid)" mask="url(#gm)"/>
<rect width="1000" height="360" fill="url(#ga)"/>
<rect width="1000" height="360" fill="url(#gb)"/>
<path class="w2" d="M0 322 Q62.5 308 125 322 T250 322 Q312.5 308 375 322 T500 322 Q562.5 308 625 322 T750 322 Q812.5 308 875 322 T1000 322 Q1062.5 308 1125 322 T1250 322 Q1312.5 308 1375 322 T1500 322 Q1562.5 308 1625 322 T1750 322 Q1812.5 308 1875 322 T2000 322 V400 H0 Z" fill="#059669" opacity="0.153"/>
<path class="w1" d="M0 330 Q62.5 318 125 330 T250 330 Q312.5 318 375 330 T500 330 Q562.5 318 625 330 T750 330 Q812.5 318 875 330 T1000 330 Q1062.5 318 1125 330 T1250 330 Q1312.5 318 1375 330 T1500 330 Q1562.5 318 1625 330 T1750 330 Q1812.5 318 1875 330 T2000 330 V400 H0 Z" fill="url(#acc)" opacity="0.272"/>
<rect y="0" width="1000" height="4" fill="url(#acc)"/>
</g>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
<text x="500" y="78" fill="#2979FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="600" letter-spacing="5">FOUNDER · WEBRIFT</text>
<text x="500" y="172" fill="#0B1220" font-size="104" font-weight="700" letter-spacing="-1.5">Walid Adra</text>
<text x="500" y="230" fill="#3A4759" font-size="42" font-weight="400">Full-Stack &amp; Platform Engineer</text>
<text x="500" y="284" fill="#66748A" font-size="30"><tspan class="pulse" fill="#059669">●</tspan> Tripoli, Lebanon · remote · open to work</text>
</g>
</svg>
