name: Refresh profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # STATS_TOKEN (optional): a fine-grained PAT with read access to private repos,
      # so commits / PRs / languages refresh too. Without it they keep their last values.
      - run: node scripts/build-stats.mjs
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Refresh profile stats" && git push
