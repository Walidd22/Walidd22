name: Contribution snake

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#10B981&color_dots=#EBEDF0,#C7DAFF,#7FAAFF,#2979FF,#0040C0
            dist/snake-dark.svg?palette=github-dark&color_snake=#34D399&color_dots=#161B22,#0B2A66,#0F45B0,#2979FF,#7FB2FF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
